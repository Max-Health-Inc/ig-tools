name: Publish to GitHub Packages

# Bump the version in your PR to release. A merge whose version is already published
# publishes nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      scope: '@max-health-inc'
      gate: false
      install: none
      tag-release: true
      create-release: true
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
